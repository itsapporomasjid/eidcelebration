<!DOCTYPE html>
<html>

<head>

<title>Sapporo Masjid Eid Celebration Outing Scanner</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/png" href="images/his-logo.png">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
font-family:Arial, Helvetica, sans-serif;
background:#F7F9F8;
margin:0;
padding:20px;
color:#2C2C2C;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
text-align:center;
}

.header{
margin-bottom:25px;
}

.logo{
width:120px;
margin-bottom:10px;
}

.header h1{
margin:0;
font-size:28px;
color:#1F6F5C;
}

.header p{
margin:5px 0 0 0;
font-size:14px;
color:#666;
}

#reader{
width:100%;
max-width:420px;
margin:auto;
}

#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
padding:18px;
border-radius:8px;
line-height:1.7;
transition:0.2s;
}

.ok{
background:#d4edda;
color:#155724;
}

.used{
background:#fff3cd;
color:#856404;
}

.error{
background:#f8d7da;
color:#721c24;
}

.infoBox{
background:#f7faf9;
border-left:4px solid #1F6F5C;
padding:14px;
margin-bottom:20px;
border-radius:6px;
font-size:14px;
line-height:1.6;
text-align:left;
}

footer{
margin-top:25px;
font-size:12px;
color:#888;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="images/his-logo.png" class="logo">

<h1>Eid Celebration Outing Scanner</h1>

<p>Sapporo Masjid</p>

</div>

<div class="infoBox">

📅 Eid Celebration Outing 2026<br>
🚌 Departure: 10:00 a.m.<br>
📍 Sapporo Masjid<br>
🎟 Scan participant QR ticket for check-in

</div>

<div id="reader"></div>

<div id="result">

Ready to scan ticket

</div>

<footer>

Hokkaido Islamic Society

</footer>

</div>

<script>

const api="https://script.google.com/macros/s/AKfycbxIHp3eYJRgJ5hv-Mq2j0uO6if5xYtKm-DMejGgbmOcbypjmIGaN1binrjknl9FvwpP/exec"

let scanner
let scanningAllowed=true

/* ============================= */
/* QR SCAN SUCCESS */
/* ============================= */

function onScanSuccess(qrText){

if(!scanningAllowed) return

scanningAllowed=false

scanner.pause(true)

/* EXTRACT TICKET */

let match = qrText.match(/Ticket:(.*)/)

let ticket = match ? match[1].trim() : null

if(!ticket){

showResult(
"❌ Invalid QR Code",
"error"
)

resumeScanner()

return

}

/* VERIFY */

fetch(api+"?qr="+encodeURIComponent(ticket))

.then(r=>r.json())

.then(data=>{

if(data.status=="OK"){

showResult(`

✅ CHECK-IN SUCCESS<br><br>

<strong>${data.name}</strong><br>

Total Seats: ${data.seats}

`,"ok")

}

else if(data.status=="USED"){

showResult(
"⚠️ Ticket Already Used",
"used"
)

}

else{

showResult(
"❌ Ticket Not Found",
"error"
)

}

resumeScanner()

})

.catch(()=>{

showResult(
"❌ Network Error",
"error"
)

resumeScanner()

})

}

/* ============================= */
/* SHOW RESULT */
/* ============================= */

function showResult(message,type){

let box =
document.getElementById("result")

box.innerHTML = message

box.className = type

}

/* ============================= */
/* RESUME SCANNER */
/* ============================= */

function resumeScanner(){

setTimeout(()=>{

try{

scanner.resume()

}
catch(e){

console.error(
"Scanner resume error",
e
)

}

document.getElementById("result").innerHTML =
"Ready to scan ticket"

document.getElementById("result").className = ""

scanningAllowed = true

},3000)

}

/* ============================= */
/* INIT */
/* ============================= */

window.onload=function(){

scanner = new Html5QrcodeScanner(

"reader",

{
fps:10,
qrbox:{width:300,height:300}
}

)

scanner.render(onScanSuccess)

}

</script>

</body>

</html>
